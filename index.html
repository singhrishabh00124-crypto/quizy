      theme: {

          colors: {

  <style>
    :root {
      --bg: #070B1A;
      --card: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      --border: rgba(255,255,255,0.12);
      --primary: linear-gradient(90deg, #22D3EE, #6366F1, #A855F7);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-cyan {
      position: fixed; width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(34,211,238,0.18) 0%, transparent 70%);
      top: -80px; left: -80px; pointer-events: none; z-index: 0; filter: blur(40px);
    }
    .glow-violet {
      position: fixed; width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.16) 0%, transparent 70%);
      bottom: 10%; right: -60px; pointer-events: none; z-index: 0; filter: blur(40px);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      border-radius: 14px;
      min-height: 48px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 600;
      border-radius: 14px;
      min-height: 48px;
      transition: transform 0.15s ease;
    }
    .btn-secondary:active { transform: scale(0.98); }
    .chip {
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .chip-active {
      background: #fff;
      color: #070B1A;
    }
    .chip-inactive {
      background: rgba(255,255,255,0.10);
      color: #CBD5E1;
    }
    .header-blur {
      background: rgba(7,11,26,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
