async function startTest(slug){
let testData=null;
const {data:test}=await supabaseClient.from('tests').select('*').eq('slug',slug).single();
testData=test;
let qs=[];
if(testData){ const {data}=await supabaseClient.from('questions').select('*').eq('test_id',testData.id).order('question_no'); qs=data||[]; }
if(qs.length===0){ qs=[{question:'H2O kya hai?',option1:'Water',option2:'Fire',option3:'Air',option4:'Stone',correct_option:1,explanation:'Water is H2O'},{question:'2+2=?',option1:'3',option2:'4',option3:'5',option4:'6',correct_option:2,explanation:'2+2=4'}]; testData={chapter_name:slug}; }
S.test=testData; S.qs=qs; S.idx=0; S.score=0; S.answers=[]; S.page='test'; render();
}
function startTimer(){
let time=15*60;
clearInterval(timerInterval);
timerInterval=setInterval(()=>{ time--; const m=Math.floor(time/60); const s=time%60; const el=document.getElementById('timer'); if(el) el.innerText=`${m}:${s<10?'0'+s:s}`; if(time<=0){ clearInterval(timerInterval); saveReport(); S.page='result'; render(); } },1000);
}
function answer(sel){ const correct=S.qs[S.idx].correct_option; S.answers[S.idx]=sel; if(sel===correct) S.score++; S.idx++; if(S.idx>=S.qs.length){ clearInterval(timerInterval); saveReport(); S.page='result'; } render(); }

function shareWA(){ const text=`Maine Quizy pe ${S.score}/${S.qs.length} laya Class ${S.cls} ${S.subject?.name||''} me! Tum bhi try karo: https://quizy.vercel.app`; window.open(`https://wa.me/?text=${encodeURIComponent(text)}`); }
